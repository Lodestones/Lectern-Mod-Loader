name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: chmod +x ./gradlew

      - name: check the tag matches the version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(grep -m1 '^mod_version=' gradle.properties | cut -d= -f2)"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match mod_version=$VERSION"
            exit 1
          fi

      - run: ./gradlew build

      - uses: softprops/action-gh-release@v2
        with:
          files: build/libs/lectern-loader-*.jar
          generate_release_notes: true
